{% extends "base.html" %}

{% block title %}Yorum Yap - {{ film_adi }}{% endblock %}

{% block extra_css %}
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Poppins', sans-serif;
        background-color: #050505;
        color: white;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
    }

    .glass-form {
        width: 90%;
        max-width: 600px;
        padding: 50px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h2 {
        margin-bottom: 10px;
        font-size: 2rem;
        text-align: center;
    }

    .sub-title {
        text-align: center;
        color: #aaa;
        margin-bottom: 30px;
        font-size: 0.9rem;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #ddd;
        font-size: 0.9rem;
    }

    input, textarea {
        width: 100%;
        padding: 15px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        color: white;
        font-family: inherit;
        font-size: 1rem;
        transition: 0.3s;
    }

    input:focus, textarea:focus {
        outline: none;
        border-color: #f5c518;
        background: rgba(0, 0, 0, 0.5);
    }

    .btn-submit {
        width: 100%;
        padding: 15px;
        background: #f5c518;
        color: #000;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
    }

    .btn-submit:hover {
        background: #d4a017;
        transform: scale(1.02);
    }

    .btn-cancel {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #666;
        text-decoration: none;
        font-size: 0.9rem;
    }

    .btn-cancel:hover { color: #fff; }
</style>
{% endblock %}

{% block content %}
    <div class="glass-form">
        <h2>Yorum Yap</h2>
        <p class="sub-title">"{{ film_adi }}" hakkında düşüncelerini paylaş.</p>

        <form action="#" method="POST">
            <div class="form-group">
                <label>Adın Soyadın</label>
                <input type="text" name="isim" placeholder="Örn: Ahmet Yılmaz" required>
            </div>

            <div class="form-group">
                <label>Yorumun</label>
                <textarea name="yorum" rows="5" placeholder="Film hakkında ne düşünüyorsun?" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Yorumu Gönder</button>

            <a href="javascript:history.back()" class="btn-cancel">Vazgeç ve Geri Dön</a>
        </form>
    </div>
{% endblock %}
