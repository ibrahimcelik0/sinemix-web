{% extends "base.html" %}

{% block title %}{{ film.isim if film else 'Film' }} - Detay{% endblock %}

{% block extra_css %}
<style>
    /* SIFIRLAMA */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Poppins', sans-serif;
        background-color: #000;
        color: white;
        height: 100vh;
        overflow: hidden; /* Sayfa kaydırmayı engelle (Tam ekran uygulama hissi) */
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* 1. KATMAN: DİNAMİK ARKA PLAN (BULANIK) */
    .background-image {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url('{{ film.resim if film else "" }}');
        background-size: cover;
        background-position: center;
        filter: blur(20px) brightness(0.4);
        z-index: 1;
        transform: scale(1.1);
    }

    /* 2. KATMAN: CAM KUTU (GLASSMORPHISM) */
    .glass-container {
        position: relative;
        z-index: 10;
        width: 85%;
        max-width: 1400px;
        height: 75vh;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        border-radius: 30px;
        padding: 60px;
        display: flex;
        align-items: center;
        gap: 60px;
        animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
    }

    /* POSTER ALANI */
    .poster-wrapper {
        flex-shrink: 0;
    }

    .poster-wrapper img {
        width: 380px;
        border-radius: 20px;
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        transition: transform 0.3s ease;
    }

    .poster-wrapper img:hover {
        transform: scale(1.03) rotate(1deg);
    }

    /* YAZI ALANI */
    .content-info {
        flex-grow: 1;
    }

    .badges {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
    }

    .badge {
        background: rgba(255, 255, 255, 0.1);
        padding: 8px 16px;
        border-radius: 50px;
        font-size: 0.9rem;
        color: #ddd;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    h1 {
        font-size: 3.5rem;
        font-weight: 700;
        margin-bottom: 15px;
        background: linear-gradient(90deg, #fff, #ccc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .rating {
        font-size: 1.5rem;
        color: #ffc107;
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .rating span {
        color: #fff;
        font-size: 1rem;
        opacity: 0.7;
        font-weight: 400;
    }

    p.description {
        font-size: 1.15rem;
        line-height: 1.8;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 40px;
        max-width: 800px;
    }

    .actions {
        display: flex;
        gap: 20px;
    }

    .btn {
        text-decoration: none;
        padding: 15px 35px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .btn-back, .btn-comment {
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-back:hover, .btn-comment:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-3px);
    }

    .btn-play {
        background: #e50914;
        color: white;
        box-shadow: 0 10px 20px rgba(229, 9, 20, 0.4);
    }

    .btn-play:hover {
        background: #f40612;
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(229, 9, 20, 0.6);
    }

    /* RESPONSIVE (MOBİL) */
    @media (max-width: 1024px) {
        .glass-container {
            flex-direction: column;
            height: auto;
            min-height: 80vh;
            padding: 40px;
            text-align: center;
            margin-top: 50px;
        }
        body { overflow-y: auto; display: block; }
        .poster-wrapper img { width: 70%; max-width: 300px; }
        .badges, .actions { justify-content: center; }
        h1 { font-size: 2.5rem; }
    }
</style>
{% endblock %}

{% block content %}
    <div class="background-image"></div>

    <div class="glass-container">
        <div class="poster-wrapper">
            <img src="{{ film.resim }}" alt="{{ film.isim }}">
        </div>

        <div class="content-info">
            <div class="badges">
                <span class="badge">4K Ultra HD</span>
                <span class="badge">Sinema Modu</span>
            </div>

            <h1>{{ film.isim }}</h1>

            <div class="rating">
                ⭐ {{ film.puan }} <span>/ 10 IMDb</span>
            </div>

            <p class="description">
                {{ film.konu }}
            </p>

            <div class="actions">
                <a href="{{ url_for('main.anasayfa') }}" class="btn btn-back">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Ana Sayfaya Dön
                </a>

                <a href="{{ url_for('movies.yorum_yap', film_ismi=film.isim) }}" class="btn btn-comment">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Yorum Yap
                </a>

                <a href="#" class="btn btn-play">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    Hemen İzle
                </a>
            </div>
        </div>
    </div>
{% endblock %}
