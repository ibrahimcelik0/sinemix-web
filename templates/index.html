<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>SineMix</title>
    <style>
        .navbar {
            background-color: #121212 
            padding 15px 40px;
            display: flex ;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            margin-bottom: 30px;
        }
        .navbar .logo{
            front-size: 1.8rem;
            front-weight: bold;
            color: #f5c518;
            text-decoration : none;
            letter-spacing: 1px;

        }
        .nav-links{
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }
        .nav-links a {
            list-style: none;
            color: white ;
            font-weight: bold;
            font-size : 1rem;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: #f5c518; 
        }
        .search-box input {
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            outline: none;
            background-color: #333;
            color: white;
            position: relative ;
            top: -3px;
        }
@keyframes sayfaGelis{
    from {
        opacity : 0;
        transform: translateY(20px);

    }
    to {
        opacity: 1 ;
        transform : translateY(0px);
    }
}
body {
    animation : sayfaGelis 0.8s ease-out;
}

        /* BASİT BİR MAKYAJ (CSS) */
        body {
            background-color: #1a1a1a; /* Koyu tema */
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; color: #ffffff; } /* IMDb Sarısı */
        
        /* Film Kartlarının Dizilimi (Izgara Sistemi) */
        .film-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        /* Tek Bir Film Kartının Tasarımı */
        .film-karti {
            background-color: #2c2c2c;
            width: 200px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.3s;
        }

        .film-karti:hover {
            transform: scale(1.05); /* Üzerine gelince büyür */
        }

        .film-karti img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .detaylar {
            padding: 15px;
        }

        .puan {
            background-color: #f5c518;
            color: black;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        h3 { margin: 10px 0; font-size: 1.1rem; }
        p { font-size: 0.8rem; color: #ccc; }
    </style>
</head>
<body>
<nav class="navbar">
        <a href="/" class="logo">🎬 SineMix</a>

        <ul class="nav-links">
            <li><a href="/">Anasayfa</a></li>
            <li><a href="#">Popüler</a></li>
            <li><a href="#">Vizyondakiler</a></li>
            <li><a href="#">Listem</a></li>
            <li><a href="/profil">Profilim</a></li>
        </ul>

        <div class="search-box">
            <input type="text" placeholder="Film ara...">
        </div>
    </nav>
    <div class="film-container">
    



   <div class="film-container">
        {% for film in filmler %}
            <a href="/film/{{ film.id }}" style="text-decoration: none; color: inherit;">
                <div class="film-karti">
                    <img src="{{ film.resim }}" alt="{{ film.isim }}">
                    <div class="detaylar">
                        <span class="puan">⭐ {{ film.puan }}</span>
                        <h3>{{ film.isim }}</h3>
                        <p>{{ film.konu }}</p>
                    </div>
                </div>
            </a>
        {% endfor %}
    </div>

</body>
</html>
